name: salla7ly
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_native_splash: ^2.4.8
  retrofit: ^4.9.0
  logger: ^2.6.0  # for logging purpose
  json_annotation: ^4.9.0
  dio: ^5.11.0
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  google_fonts: ^8.2.0
  injectable: ^3.0.0
  get_it: ^9.2.1
  freezed: ^4.0.0-dev.3
  freezed_annotation: ^3.1.0
  hive: ^2.2.3
  device_preview: ^1.3.1
  flutter_svg: ^2.3.0
  fluttertoast: ^9.1.0
  flutter_bloc: ^9.1.1
  shimmer: ^3.0.0
  auto_size_text: ^3.0.0
  flutter_localization: ^0.4.1
  pin_code_fields: ^9.4.0
  file_picker: ^10.3.2
  image_picker: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  retrofit_generator: ^10.0.1
  build_runner: ^2.6.0
  json_serializable: ^6.10.0
  injectable_generator: ^3.1.1

flutter:
    uses-material-design: true
    assets:
     - assets/images/
     - assets/svgs/
flutter_assets:
  assets_path:
    - assets/images/
    - assets/svgs/
  output_path: lib/core/theming/
  filename: assets.dart
  field_prefix:

  uses-material-design: true
